  <!-- Description -->
  <text x="64" y="308" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#881337" fill-opacity="0.85">
    <tspan x="64" dy="0">Aprende inglés sin estrés, a tu ritmo y</tspan>
    <tspan x="64" dy="24">disfrutando del proceso. Vocabulario dulce,</tspan>
    <tspan x="64" dy="24">repetición espaciada y una tutora de IA que</tspan>
    <tspan x="64" dy="24">nunca pierde la paciencia.</tspan>
  </text>

